<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <g filter="url(#shadow)">
    <!-- Mortarboard Skull Base -->
    <path d="M 185 270 Q 256 360 327 270 L 327 305 Q 256 395 185 305 Z" fill="#c7d2fe"/>
    
    <!-- Mortarboard Rhombus Top -->
    <polygon points="256,125 410,215 256,305 102,215" fill="url(#capGrad)"/>
    
    <!-- Tassel Center Button -->
    <ellipse cx="256" cy="215" rx="12" ry="7" fill="url(#goldGrad)"/>
    
    <!-- Tassel String -->
    <path d="M 256 215 Q 355 240 380 280" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Tassel Hanging Fringe -->
    <rect x="372" y="280" width="16" height="52" rx="6" fill="url(#goldGrad)"/>
    <circle cx="380" cy="280" r="9" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Sparkling Achievement Star -->
  <path d="M 390 120 Q 390 145 415 145 Q 390 145 390 170 Q 390 145 365 145 Q 390 145 390 120 Z" fill="url(#goldGrad)"/>
  <circle cx="390" cy="145" r="4" fill="#ffffff"/>
</svg>
